<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="560" fill="#0d1117"/>
  <text x="500" y="38" fill="#e6f7ff" font-size="22" font-weight="700" text-anchor="middle">Zombie Drone wiring: Seeed Base Shield V2 on the B-L4S5I-IOT01A</text>
  <text x="500" y="62" fill="#8fb3c4" font-size="14" text-anchor="middle">Shield power switch on 3V3. Grove wires: yellow = SCL / signal, white = SDA, red = VCC, black = GND</text>

  <!-- board + shield -->
  <rect x="330" y="95" width="340" height="400" rx="14" fill="#123a2a" stroke="#3fbf7f" stroke-width="2"/>
  <text x="500" y="125" fill="#bff5d6" font-size="16" font-weight="700" text-anchor="middle">B-L4S5I-IOT01A + Base Shield V2</text>
  <rect x="345" y="145" width="310" height="44" rx="6" fill="#0b2419" stroke="#3fbf7f"/>
  <text x="500" y="164" fill="#d6ffe8" font-size="12" text-anchor="middle">on board: LSM6DSL, LIS3MDL, LPS22HB, HTS221</text>
  <text x="500" y="181" fill="#d6ffe8" font-size="12" text-anchor="middle">VL53L0X ToF (I2C2, XSHUT = PC6), nothing to wire</text>

  <!-- I2C port -->
  <rect x="360" y="215" width="130" height="70" rx="6" fill="#1d2b44" stroke="#58a6ff" stroke-width="2"/>
  <text x="425" y="240" fill="#cfe3ff" font-size="15" font-weight="700" text-anchor="middle">Grove "I2C"</text>
  <text x="425" y="259" fill="#9fc3ff" font-size="12" text-anchor="middle">SCL D15 = PB8</text>
  <text x="425" y="275" fill="#9fc3ff" font-size="12" text-anchor="middle">SDA D14 = PB9 (I2C1)</text>

  <!-- D4 port -->
  <rect x="510" y="215" width="130" height="70" rx="6" fill="#3a2a12" stroke="#f0a020" stroke-width="2"/>
  <text x="575" y="240" fill="#ffe2b0" font-size="15" font-weight="700" text-anchor="middle">Grove "D4"</text>
  <text x="575" y="259" fill="#ffd18a" font-size="12" text-anchor="middle">signal D4 = PA3</text>
  <text x="575" y="275" fill="#ffd18a" font-size="12" text-anchor="middle">(2nd pin D5 unused)</text>

  <!-- switch -->
  <rect x="360" y="305" width="280" height="40" rx="6" fill="#2a1630" stroke="#c070ff"/>
  <text x="500" y="331" fill="#ecd2ff" font-size="14" text-anchor="middle">VCC switch → 3V3</text>

  <!-- USB -->
  <rect x="345" y="365" width="310" height="40" rx="6" fill="#1a1a1a" stroke="#888"/>
  <text x="500" y="391" fill="#ddd" font-size="13" text-anchor="middle">USB ST-LINK → PC (COM port, 115200 baud)</text>
  <text x="500" y="440" fill="#8fb3c4" font-size="12" text-anchor="middle">fallback: firmware also looks for the OLED on</text>
  <text x="500" y="456" fill="#8fb3c4" font-size="12" text-anchor="middle">A4 = PC1 (SDA) / A5 = PC0 (SCL), I2C3</text>
  <text x="500" y="478" fill="#ff9a9a" font-size="11.5" text-anchor="middle">keep the ToF window uncovered (hand-grab trigger)</text>

  <!-- OLED -->
  <rect x="40" y="200" width="210" height="110" rx="8" fill="#101826" stroke="#58a6ff" stroke-width="2"/>
  <rect x="60" y="218" width="170" height="52" fill="#000" stroke="#334"/>
  <text x="145" y="241" fill="#7fd0ff" font-size="13" font-family="Consolas, monospace" text-anchor="middle">BATTLE      PC</text>
  <text x="145" y="259" fill="#7fd0ff" font-size="13" font-family="Consolas, monospace" text-anchor="middle">EN [#####] 5/10</text>
  <text x="145" y="292" fill="#cfe3ff" font-size="14" font-weight="700" text-anchor="middle">1.3" I2C OLED</text>
  <text x="145" y="330" fill="#8fb3c4" font-size="12" text-anchor="middle">SH1106 / SSD1306, 0x3C</text>
  <!-- OLED wires -->
  <g stroke-width="4" fill="none">
    <path d="M250 225 C300 225 320 235 360 235" stroke="#f2d13a"/>
    <path d="M250 240 C300 240 320 248 360 248" stroke="#f2f2f2"/>
    <path d="M250 255 C300 255 320 262 360 262" stroke="#e5484d"/>
    <path d="M250 270 C300 270 320 276 360 276" stroke="#555"/>
  </g>
  <g font-size="11" fill="#c9d6df">
    <text x="258" y="220">SCL</text><text x="258" y="236">SDA</text><text x="258" y="251">VCC</text><text x="258" y="286">GND</text>
  </g>

  <!-- Buzzer -->
  <rect x="760" y="200" width="200" height="110" rx="8" fill="#261a0c" stroke="#f0a020" stroke-width="2"/>
  <circle cx="860" cy="240" r="24" fill="#111" stroke="#666" stroke-width="3"/>
  <circle cx="860" cy="240" r="5" fill="#444"/>
  <text x="860" y="292" fill="#ffe2b0" font-size="14" font-weight="700" text-anchor="middle">Active buzzer (HIGH = on)</text>
  <text x="860" y="330" fill="#8fb3c4" font-size="12" text-anchor="middle">digital output, NOT an I2C device</text>
  <g stroke-width="4" fill="none">
    <path d="M640 232 C690 232 710 225 760 225" stroke="#f2d13a"/>
    <path d="M640 262 C690 262 710 255 760 255" stroke="#e5484d"/>
    <path d="M640 276 C690 276 710 272 760 272" stroke="#555"/>
  </g>
  <g font-size="11" fill="#c9d6df">
    <text x="700" y="220">SIG</text><text x="700" y="250">VCC</text><text x="700" y="290">GND</text>
  </g>

  <text x="500" y="535" fill="#6f8a99" font-size="12" text-anchor="middle">Pins and OLED / buzzer settings are in Core/Src/app_config.h. Checked against the template's main.h pin names.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
